<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Secure Institutional Portal</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MSAL -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
    </style>
</head>

<body class="min-h-screen text-slate-800 flex items-center justify-center">

<div class="max-w-md w-full glass-morphism p-8 rounded-3xl shadow-xl border border-slate-100 animate-fade-in">

    <div class="text-center mb-8">
        <div class="bg-indigo-600 p-3 rounded-lg inline-block mb-4">
            <i class="fas fa-calendar-check text-white text-2xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">CampusConnect</h1>
        <p class="text-slate-500">Secure Institutional Login</p>
    </div>

    <button onclick="loginWithMicrosoft()" 
        class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-3">
        <i class="fab fa-microsoft text-lg"></i>
        Login with Microsoft
    </button>

    <p class="text-xs text-center text-slate-400 mt-6">
        Authentication powered by Microsoft Entra ID
    </p>

</div>

<script>
const msalConfig = {
    auth: {
        clientId: "863e351a-44ba-4b0a-8398-efe98845b17f",
        authority: "https://login.microsoftonline.com/7359f896-71e2-4dae-b8a3-15cdf97f2f10",
        redirectUri: window.location.origin + "/index.html"
    },
    cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
    }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);

document.addEventListener("DOMContentLoaded", async () => {

    try {
        const response = await msalInstance.handleRedirectPromise();

        if (response) {
            msalInstance.setActiveAccount(response.account);

            sessionStorage.setItem("cc_user", JSON.stringify({
                name: response.account.name,
                username: response.account.username,
                id: response.account.localAccountId
            }));

            window.location.replace("home.html");
            return;
        }

        const accounts = msalInstance.getAllAccounts();

        if (accounts.length > 0) {
            window.location.replace("home.html");
        }

    } catch (error) {
        console.error(error);
    }
});

function loginWithMicrosoft() {
    msalInstance.loginRedirect({
        scopes: ["openid", "profile", "email"]
    });
}
</script>

</body>
</html>
